# Babin Rentals OS — static serving for the Docker image.
#
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile, which the stock
# nginx.conf includes from inside its `http` block — so the `map` below is in a
# legal context. If you deploy to Vercel instead, `vercel.json` carries the
# equivalent rules and this file is unused; the two must not disagree about the
# rewrite or about caching.

# ── caching, decided once ────────────────────────────────────────────────────
#
# Deliberately a `map` feeding a single `add_header` rather than a Cache-Control
# per `location`. nginx inherits `add_header` from the enclosing level ONLY when
# the current level declares none of its own — so the moment a location sets its
# own Cache-Control it silently drops every security header set on the server.
# The obvious per-location spelling therefore costs `/assets/` its `nosniff` and
# the shell its `X-Frame-Options: DENY`, with nothing anywhere to indicate it.
# One `add_header` block, evaluated per request, cannot have that bug.
#
# `$uri` is read when the response headers are written — after `try_files` has
# internally redirected a deep link to /index.html — so deep links get the
# shell's no-cache rule, not the default.
map $uri $babin_cache_control {
    default                   "";
    # Content-hashed by Vite: the filename changes whenever the bytes do.
    ~^/assets/                "public, max-age=31536000, immutable";
    # The service worker is registered with `registerType: 'autoUpdate'`. A
    # cached sw.js pins a device to an old build indefinitely — the single most
    # common way a PWA "refuses to update".
    ~^/(sw|registerSW)\.js$   "no-cache, no-store, must-revalidate";
    # Both shells (index.html, marketing.html) must be revalidated every load or
    # a released fix never reaches a device that already has the page.
    ~^/[^/]*\.html$           "no-cache, must-revalidate";
    /manifest.webmanifest     "no-cache, must-revalidate";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Nepali mobile connections are the constraint this product is built for.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    etag on;

    # ── every response header, in one place ──────────────────────────────────
    # An empty `$babin_cache_control` adds nothing: nginx skips an add_header
    # whose value evaluates to an empty string.
    add_header Cache-Control          $babin_cache_control always;
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "same-origin"        always;
    #
    # No Content-Security-Policy is set. Writing one that is actually correct
    # needs the Supabase project origin and, if error tracking is switched on,
    # the Sentry ingest origin — both build-time values this file cannot see.
    # Shipping a wrong CSP silently breaks auth; shipping none is honest.
    # TODO(decision): agree the connect-src allowlist, then add it here.

    # ── the rewrite this file exists for ─────────────────────────────────────
    #
    # The app is a client-side router. `/` is the only HTML document the router
    # is mounted in; `/today`, `/rentals/B-715`, `/operations/packing`
    # and every other route exist in JavaScript only — there is no such file on
    # disk. Without this line, a deep link, a browser refresh anywhere but the
    # root, a bookmarked booking, and every PWA shortcut declared in
    # `vite.config.ts` (`/scan`, `/today`, `/rentals/new`, `/operations/packing`)
    # all return 404 in production while working perfectly in `npm run dev` —
    # because the Vite dev server performs this rewrite for you and a static
    # host does not.
    #
    # `$uri` is tried first so real files still win. That is load-bearing here:
    # `marketing.html` is a second Rollup entry point and a genuine document,
    # not a route, and serving the app shell in its place would hand every
    # first-time visitor the whole ops bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Container health probe: no rewrite, no body, no log.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
