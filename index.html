<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdefdc" />
    <title>Babin Rentals OS</title>

    <!--
      No font <link> here on purpose. Fonts are self-hosted and imported in
      src/main.tsx so they are bundled and precacheable — the app has to render
      correctly offline, and a CDN cannot be reached from a warehouse with no
      signal. See Platform Build Instructions §4.1.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      Foundation v2.2 §4.3.11 — "applied before first paint so nothing reflows
      on load." This runs ahead of the bundle for that reason; the same value is
      written by lib/textSize.ts when the user changes it in Settings.
    -->
    <script>
      (function () {
        var v = localStorage.getItem('br-text-size')
        var s = v === 'compact' ? 0.9 : v === 'large' ? 1.15 : 1
        document.documentElement.style.setProperty('--ui-scale', String(s))
      })()
    </script>
    <!--
      Same reasoning as the --ui-scale script above, for lib/theme.tsx's
      'br-theme-mode'. Without this, a 'system' user whose OS prefers light
      gets a real ~200ms dark-to-light flash on every cold load: this file's
      hardcoded data-theme="dark" paints first, then ThemeProvider's mount
      effect flips it, and the surface transition (theme.css --dur-theme)
      animates out of dark while the untransitioned text color has already
      snapped to light.
    -->
    <script>
      (function () {
        var mode = localStorage.getItem('br-theme-mode')
        // DESIGN_DIRECTION_SPEC_v4.2 §2.1 — LIGHT is the in-app default,
        // superseding v4.1's dark-first ruling. The unset branch must agree
        // with lib/theme.tsx (which also resolves an unset user to 'light'),
        // or a first-time visitor gets one painted frame of the wrong theme
        // before React corrects it. 'system' is still honoured for anyone who
        // chose it explicitly; the per-user toggle persists either way.
        var resolved =
          mode === 'dark' || mode === 'light'
            ? mode
            : mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : 'light'
        document.documentElement.setAttribute('data-theme', resolved)
      })()
    </script>
    <!--
      DESIGN_DIRECTION_SPEC_v4.1 §7.7 — the viewport band, before first paint.

      Same reasoning as the two scripts above: without this the first frame is
      laid out for whatever the CSS defaults to and then re-laid-out once
      device.ts mounts, which on a phone is a visible reflow of the whole page.

      768 / 1280 are duplicated from lib/breakpoints.ts because an inline
      pre-paint script cannot import a module. lib/__tests__/breakpoints.test.ts
      parses THIS FILE and fails if the numbers drift apart — that guard is the
      whole reason the duplication is acceptable.
    -->
    <script>
      (function () {
        function band() {
          var w = window.innerWidth
          return w < 768 ? 'phone' : w < 1280 ? 'tablet' : 'desktop'
        }
        var el = document.documentElement
        el.setAttribute('data-vp', band())
        // Keep it truthful when a window is dragged across a threshold or a
        // tablet rotates. matchMedia, not resize: it fires only when a
        // threshold is actually crossed, not on every pixel of a drag.
        if (window.matchMedia) {
          var sync = function () { el.setAttribute('data-vp', band()) }
          window.matchMedia('(max-width: 767px)').addEventListener('change', sync)
          window.matchMedia('(min-width: 1280px)').addEventListener('change', sync)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
